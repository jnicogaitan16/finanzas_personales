name: finanzas-personales

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://evolution:evolution@postgres:5432/finanzas
      REDIS_URL: redis://redis:6379/1
      TZ: America/Bogota
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Postgres de este proyecto: host 5433. No usar 5432 (eso es kamecol).
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
      - ./postgres/init-finanzas.sh:/docker-entrypoint-initdb.d/init-finanzas.sh:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - evolution_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-backup:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: evolution
      BACKUP_RETENTION_DAYS: 7
      TZ: America/Bogota
    volumes:
      - ./postgres/backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Backup scheduler iniciado. Primer backup en 1 min, luego cada 12h."
        sleep 60 && /backup.sh
        while true; do sleep 43200; /backup.sh; done

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  evolution_postgres:
  evolution_redis:
