name: finanzas-personales

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://evolution:evolution@postgres:5432/finanzas
      REDIS_URL: redis://redis:6379/1
      TZ: America/Bogota
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_WEBHOOK_URL: http://backend:8000/webhook/evolution
    depends_on:
      postgres:
        condition: service_healthy
      evolution:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    ports:
      - "8080:8080"
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      TZ: America/Bogota
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: finanzas
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/0
      CACHE_REDIS_PREFIX_KEY: finanzas
      CACHE_LOCAL_ENABLED: "false"
      QRCODE_LIMIT: "30"
      CONFIG_SESSION_PHONE_CLIENT: Finanzas
      CONFIG_SESSION_PHONE_NAME: Chrome
      LANGUAGE: es
      DEL_INSTANCE: "false"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Postgres de este proyecto: host 5433. No usar 5432 (eso es kamecol).
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
      - ./postgres/init-finanzas.sh:/docker-entrypoint-initdb.d/init-finanzas.sh:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - evolution_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-backup:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: evolution
      BACKUP_RETENTION_DAYS: 7
      TZ: America/Bogota
    volumes:
      - ./postgres/backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Backup scheduler iniciado. Primer backup en 1 min, luego cada 12h."
        sleep 60 && /backup.sh
        while true; do sleep 43200; /backup.sh; done

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  evolution_instances:
  evolution_postgres:
  evolution_redis:
